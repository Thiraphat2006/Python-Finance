[project]
name = "python-finance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "metatrader5>=5.0.5735",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pyarrow>=26.0.0",
    "ta>=0.11.0",
    "vectorbt>=0.28.2",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["Test"]
