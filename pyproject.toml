[project]
name = "python-finance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "MetaTrader5>=5.0.5735; sys_platform == 'win32'",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pyarrow>=26.0.0",
    "ta>=0.11.0",
    "vectorbt>=0.28.2",
    "yfinance>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "mypy>=2.4.1",
    "pandas-stubs>=2.3.2.250926",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
# closed research code / needs live MT5 terminal
omit = [
    "src/project/Untility/back_testing.py",
    "src/project/Untility/data_loader.py",
    "src/project/Untility/evaluate.py",
    "src/project/Untility/run_matrix.py",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["Test"]

[tool.ruff]
extend-exclude = ["docs"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
[[tool.mypy.overrides]]
module = ["MetaTrader5", "vectorbt", "vectorbt.*"]
ignore_missing_imports = true
